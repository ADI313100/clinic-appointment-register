<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic Appointment Register</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background: linear-gradient(135deg, #F0F9FF 0%, #E8F4F8 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
        }
        
        .content {
            padding-left: 80px;
            flex: 1;
            z-index: 10;
        }
        
        .title {
            font-size: 56px;
            font-weight: 900;
            color: #0F172A;
            line-height: 1.2;
            margin-bottom: 24px;
            letter-spacing: -1px;
        }
        
        .subtitle {
            font-size: 24px;
            color: #64748B;
            font-weight: 400;
            line-height: 1.4;
            margin-bottom: 40px;
            max-width: 500px;
        }
        
        .tagline {
            font-size: 16px;
            color: #94A3B8;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        
        .cta {
            display: inline-block;
            padding: 16px 32px;
            background: #0F172A;
            color: white;
            text-decoration: none;
            font-weight: 600;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .cta:hover {
            background: #1E293B;
            transform: translateY(-2px);
        }
        
        /* Decorative geometric shapes */
        .shape-circle-1 {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(147, 197, 253, 0.2);
            border-radius: 50%;
            top: -100px;
            right: 50px;
        }
        
        .shape-circle-2 {
            position: absolute;
            width: 200px;
            height: 200px;
            background: rgba(251, 113, 133, 0.15);
            border-radius: 50%;
            bottom: -50px;
            right: 150px;
        }
        
        .shape-rect {
            position: absolute;
            width: 150px;
            height: 150px;
            background: rgba(147, 197, 253, 0.1);
            bottom: 80px;
            right: 50px;
            transform: rotate(45deg);
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="content">
            <div class="tagline">Healthcare Innovation</div>
            <h1 class="title">Clinic Appointment and Follow-Up Register</h1>
            <p class="subtitle">Intelligent appointment management with ML-powered no-show prediction</p>
        </div>
        
        <!-- Decorative shapes -->
        <div class="shape-circle-1"></div>
        <div class="shape-circle-2"></div>
        <div class="shape-rect"></div>
    </div>
</body>
</html>
