<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      .slide-container { 
        width: 1280px; 
        min-height: 720px; 
        background: #F0F9FF; 
        color: #334155;
        font-family: 'Inter', sans-serif;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .title {
        font-size: 72px;
        font-weight: 900;
        color: #0F172A;
        font-family: 'Syne', sans-serif;
        letter-spacing: -2px;
        margin-bottom: 20px;
      }
      .summary-list {
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 30px;
        max-width: 1000px;
        margin-bottom: 60px;
      }
      .summary-item {
        background: white;
        padding: 20px 30px;
        font-size: 20px;
        font-weight: 700;
        color: #0F172A;
        border-bottom: 4px solid #FB7185;
      }
      .cta-section {
        max-width: 800px;
      }
      .cta-text {
        font-size: 28px;
        font-weight: 400;
        color: #64748B;
        line-height: 1.5;
        margin-bottom: 40px;
      }
      .cta-button {
        display: inline-block;
        background: #0F172A;
        color: white;
        padding: 20px 40px;
        font-size: 24px;
        font-weight: 800;
        text-decoration: none;
        letter-spacing: 1px;
      }
      .accent-circle-large {
        position: absolute;
        width: 600px;
        height: 600px;
        background: #93C5FD;
        opacity: 0.05;
        border-radius: 50%;
        top: -300px;
        left: -300px;
      }
      .accent-circle-small {
        position: absolute;
        width: 300px;
        height: 300px;
        background: #FB7185;
        opacity: 0.05;
        border-radius: 50%;
        bottom: -150px;
        right: -150px;
      }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="accent-circle-large"></div>
        <div class="accent-circle-small"></div>
        
        <h1 class="title">Ready to Transform Your Clinic?</h1>
        
        <div class="summary-list">
            <div class="summary-item">Intelligent Predictions</div>
            <div class="summary-item">Complete Management</div>
            <div class="summary-item">Modern Design</div>
            <div class="summary-item">Scalable Architecture</div>
        </div>
        
        <div class="cta-section">
            <p class="cta-text">
                The Clinic Appointment and Follow-Up Register provides the tools you need to reduce no-shows, improve efficiency, and deliver exceptional patient care.
            </p>
            <div class="cta-button">
                START YOUR DEMO TODAY <i class="fas fa-arrow-right" style="margin-left: 15px;"></i>
            </div>
        </div>
    </div>
</body>
</html>
